name: Path length

# Backstop for the lefthook pre-commit hook, which only runs for contributors
# who have installed it. Both call .github/scripts/check_path_length.py.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  path-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check tracked paths against the byte budget
        run: python3 .github/scripts/check_path_length.py
